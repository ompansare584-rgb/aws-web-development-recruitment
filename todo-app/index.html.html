<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow — Vanilla JS To-Do App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <main class="app-container">
        <header class="app-header">
            <h1>TaskFlow.</h1>
            <p>Get things done, one task at a time.</p>
        </header>

        <!-- Todo Input Form -->
        <form id="todo-form" class="todo-form">
            <input type="text" id="todo-input" placeholder="What needs to be done?" autocomplete="off" required>
            <button type="submit" id="add-btn"><i class="fa-solid fa-plus"></i> Add</button>
        </form>

        <!-- Filters & Stats Bar -->
        <div class="controls-bar">
            <span id="items-count">0 items left</span>
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>
        </div>

        <!-- Todo List Container -->
        <ul id="todo-list" class="todo-list">
            <!-- Dynamic items will be injected here -->
        </ul>
    </main>

    <script src="script.js"></script>
</body>
</html>
